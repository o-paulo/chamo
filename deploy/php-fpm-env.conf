; Add these entries under [www]. Keep FPM's clear_env enabled and explicitly
; pass only the application settings from its systemd service environment.
env[APP_ENV] = $APP_ENV
env[CHAMO_DEMO_ACCOUNTS] = $CHAMO_DEMO_ACCOUNTS
env[CHAMO_FORCE_HTTPS] = $CHAMO_FORCE_HTTPS
env[CHAMO_BASE_URL] = $CHAMO_BASE_URL
env[CHAMO_TIMEZONE] = $CHAMO_TIMEZONE
env[CHAMO_BUSINESS_START_HOUR] = $CHAMO_BUSINESS_START_HOUR
env[CHAMO_BUSINESS_END_HOUR] = $CHAMO_BUSINESS_END_HOUR
env[CHAMO_STORAGE] = $CHAMO_STORAGE
env[CHAMO_APP_KEY] = $CHAMO_APP_KEY
env[CHAMO_SMTP_HOST] = $CHAMO_SMTP_HOST
env[CHAMO_SMTP_PORT] = $CHAMO_SMTP_PORT
env[CHAMO_SMTP_ENCRYPTION] = $CHAMO_SMTP_ENCRYPTION
env[CHAMO_SMTP_USERNAME] = $CHAMO_SMTP_USERNAME
env[CHAMO_SMTP_PASSWORD] = $CHAMO_SMTP_PASSWORD
env[CHAMO_MAIL_FROM] = $CHAMO_MAIL_FROM
env[CHAMO_MAIL_FROM_NAME] = $CHAMO_MAIL_FROM_NAME
