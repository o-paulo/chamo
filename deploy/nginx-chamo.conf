server {
    listen 80;
    server_name suporte.seudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name suporte.seudominio.com;
    root /var/www/chamo;
    index TelaLogin.html;
    client_max_body_size 10m;

    # Replace these paths with certificates provisioned for your domain.
    ssl_certificate /etc/letsencrypt/live/suporte.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suporte.seudominio.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(?:storage|scripts|vendor|tests|backups)(?:/|$) {
        return 404;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(?:sqlite|env|md|json|lock)$ {
        return 404;
    }
    location ~ \.php$ {
        if ($uri !~ ^/api\.php$) {
            return 404;
        }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location / {
        try_files $uri =404;
    }
}
